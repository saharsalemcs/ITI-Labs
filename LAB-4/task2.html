<!-- 

Task2:


Write a JavaScript function named compareNumbers that:

Prompts the user to enter two numbers

Converts the inputs to numeric values

Validates the inputs

Compares the numbers using comparison operators (>, <, ==)

Displays the result

Logs detailed comparison information

-->

<!doctype html>
<html lang="en">
  <head>
    <title>Task 2</title>
  </head>
  <body>
    <script>
      function compareNumbers() {
        var input1 = prompt("Enter the first number:");
        var input2 = prompt("Enter the second number:");

        var num1 = Number(input1);
        var num2 = Number(input2);

        if (
          input1 === null ||
          input2 === null ||
          input1.trim() === "" ||
          input2.trim() === "" ||
          isNaN(num1) ||
          isNaN(num2)
        ) {
          alert("Invalid input. Please enter valid numeric values.");
          return;
        }

        var relation = "";
        if (num1 > num2) {
          relation = "greater than";
        } else if (num1 < num2) {
          relation = "less than";
        } else {
          relation = "equal to";
        }

        alert(num1 + " is " + relation + " " + num2);

        console.log("First Number:", num1);
        console.log("Second Number:", num2);
        console.log(num1 + " > " + num2 + ":", num1 > num2);
        console.log(num1 + " < " + num2 + ":", num1 < num2);
        console.log(num1 + " == " + num2 + ":", num1 == num2);
      }

      compareNumbers();
    </script>
  </body>
</html>
