  <body>
    <script>
      function outer() {
        let x = 10;
        console.log("x from outer", x); // 10

        function inner() {
          x += 5;
          console.log("x from inner", x); // 15
        }
        x = 20; // 25
        inner();
        // x = 20; // 15  'for test'
      }

      outer();
    </script>
