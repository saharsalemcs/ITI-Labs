<!doctype html>
<html lang="en">
  <head>
    <title>Task 3</title>
  </head>
  <!-- 
  Task 3: Favorite Color Response using Switch
  Prompt the user to enter their favorite color and respond with a custom message:
  - blue -> "Cool and calm choice!"
  - red -> "Bold and passionate!"
  - green -> "Fresh and lively!"
  - Otherwise -> "Interesting color!"
  Make it case-insensitive.
  -->
  <body>
    <script>
      var input = prompt("What is your favorite color?");

      if (input === null || input.trim() === "") {
        alert("Invalid input! enter a color.");
        return;
      }
      // case-insensitive
      var color = input.trim().toLowerCase();

      switch (color) {
        case "blue":
          alert("Cool and calm choice!");
          break;
        case "red":
          alert("Bold and passionate!");
          break;
        case "green":
          alert("Fresh and lively!");
          break;
        default:
          alert("Interesting color!");
          break;
      }
    </script>
  </body>
</html>
