<!doctype html>
<html lang="en">
  <head>
    <title>Task 1</title>
  </head>
  <!-- 
  Task 1: Age Access Checker
  Ask the user for their age and display one of the following messages:
  - If age < 13 -> "You are too young to access this site."
  - If age is between 13 and 17 -> "Parental guidance is advised."
  - If age is 18 or older -> "Access granted!"
  Make sure to validate the input and reject negative or non-numeric values.
  -->
  <body>
    <script>
      var input = prompt("enter your age:");

      var age = Number(input);

      if (input === null || input.trim() === "" || isNaN(age) || age < 0) {
        alert("Invalid input! Please enter a valid number.");
        return;
      }

      if (age < 13) {
        alert("You are too young to access this site.");
      } else if (age >= 13 && age <= 17) {
        alert("Parental guidance is advised.");
      } else {
        alert("Access granted!");
      }
    </script>
  </body>
</html>
