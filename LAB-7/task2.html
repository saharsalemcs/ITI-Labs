<!doctype html>
<html lang="en">
  <head>
    <title>Slide Show Game</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #ffffff;
      }

      .slider-container {
        width: 600px;
        text-align: center;
      }

      .image-wrapper {
        border: 8px solid #f3c218;
        padding: 2px;
        background-color: #ffffff;
        margin-bottom: 20px;
        height: 450px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      #sliderImage {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .controls {
        display: flex;
        justify-content: space-between;
      }

      button {
        background-color: #f3c218;
        color: #ffffff;
        border: none;
        padding: 10px 40px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="slider-container">
      <h1>Slide Show Game</h1>

      <div class="image-wrapper">
        <img id="sliderImage" src="" alt="Slider Image" />
      </div>

      <div class="controls">
        <button id="prevBtn">&lt;</button>
        <button id="nextBtn">&gt;</button>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var images = [
          "images/1.jpg",
          "images/2.jpg",
          "images/3.jpg",
          "images/4.jpg",
        ];

        var currentIndex = 0;
        var sliderImage = document.getElementById("sliderImage");
        var prevBtn = document.getElementById("prevBtn");
        var nextBtn = document.getElementById("nextBtn");

        function updateImage() {
          sliderImage.src = images[currentIndex];
        }

        nextBtn.addEventListener("click", function () {
          currentIndex++;

          if (currentIndex >= images.length) {
            currentIndex = 0;
          }

          updateImage();
        });

        prevBtn.addEventListener("click", function () {
          currentIndex--;

          if (currentIndex < 0) {
            currentIndex = images.length - 1;
          }

          updateImage();
        });

        updateImage();
      });
    </script>
  </body>
</html>
