<html>
  <head>
    <title>Task 4</title>
    <style>
      body {
        background-color: #ffffff;
        margin: 0;
        padding: 30px;
        font-family: Arial, Helvetica, sans-serif;
      }
      #list {
        width: 640px;
        margin: 0 auto;
      }
      .row {
        border-bottom: 1px solid #e0e0e0;
        padding: 20px 0;
      }
      .row:after {
        content: "";
        display: block;
        clear: both;
      }
      .iconwrap {
        float: left;
        width: 56px;
        height: 56px;
      }
      .iconwrap img {
        width: 56px;
        height: 56px;
        display: inline-block;
      }
      .textwrap {
        float: left;
        width: 460px;
        margin-left: 20px;
      }
      .title {
        font-size: 15px;
        color: #29abe2;
        margin: 6px 0 6px 0;
        font-weight: normal;
      }
      .desc {
        font-size: 13px;
        color: #777777;
        margin: 0;
        line-height: 18px;
      }
      .selectwrap {
        float: right;
        margin-top: 16px;
      }
      .selectbtn {
        display: inline-block;
        background-color: #f2f2f2;
        color: #555555;
        padding: 10px 18px;
      }
    </style>
  </head>
  <body>
    <div id="list">
      <div class="row">
        <div class="iconwrap"><img src="images/forms.png" alt="" /></div>
        <div class="textwrap">
          <p class="title">General forms</p>
          <p class="desc">
            Build, design, and translate signup forms and response emails.
          </p>
        </div>
        <div class="selectwrap"><span class="selectbtn">Select</span></div>
      </div>

      <div class="row">
        <div class="iconwrap"><img src="images/tag.png" alt="" /></div>
        <div class="textwrap">
          <p class="title">Embedded forms</p>
          <p class="desc">
            Generate HTML code to embed in your site or blog to collect signups.
          </p>
        </div>
        <div class="selectwrap"><span class="selectbtn">Select</span></div>
      </div>

      <div class="row">
        <div class="iconwrap">
          <img src="images/popup.png" alt="" />
        </div>
        <div class="textwrap">
          <p class="title">Subscriber popup</p>
          <p class="desc">
            Design a popup signup form that can be embedded on any site.
          </p>
        </div>
        <div class="selectwrap"><span class="selectbtn">Select</span></div>
      </div>
    </div>
  </body>
</html>
