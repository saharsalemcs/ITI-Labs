<!doctype html>
<html>
  <head>
    <title>Task 1 :)</title>
  </head>
  <body>
    <script>
      var input = prompt("Enter array Values as", "1,2,3,1,3");

      if (input !== null && input.trim() !== "") {
        var valuesArray = input.split(",");

        var seenValues = {};
        var repeatedIndices = [];

        document.write("<table border='1'>");
        document.write("<tr><th>Values</th></tr>");

        for (var i = 0; i < valuesArray.length; i++) {
          var val = valuesArray[i];

          document.write("<tr><td>" + val + "</td></tr>");

          if (seenValues[val] !== undefined) {
            repeatedIndices.push(i);
          } else {
            seenValues[val] = true;
          }
        }

        document.write("</table>");

        if (repeatedIndices.length > 0) {
          for (var j = 0; j < repeatedIndices.length; j++) {
            if (j === 0) {
              document.write(
                "<p>repeated row number " + repeatedIndices[j] + "</p>",
              );
            } else {
              document.write("<p>row number " + repeatedIndices[j] + "</p>");
            }
          }
        } else {
          document.write("<p>No repeated values</p>");
        }
      }
    </script>
  </body>
</html>
