<html>
  <head>
    <title>RGB Colors</title>
  </head>
  <body>
    <table
      cellspacing="7"
      cellpadding="10"
      border="1"
      width="350px"
      height="200px"
      bgcolor="#DADADA"
    >
      <tr>
        <th colspan="3">
          <font face="Arial, Helvetica, sans-serif">RGB Colors</font>
        </th>
      </tr>
      <tr>
        <td rowspan="9" align="center">
          <font face="Arial, Helvetica, sans-serif">
            <b>
              E<br />
              x<br />
              a<br />
              m<br />
              p<br />
              l<br />
              e<br />
              s
            </b>
          </font>
        </td>
        <td align="center">
          <font face="Arial, Helvetica, sans-serif"><b>Black</b></font>
        </td>
        <td bgcolor="#000000" align="center">
          <font face="Courier New, monospace" color="#ffffff"
            ><b>#000000</b></font
          >
        </td>
      </tr>
      <tr>
        <td align="center">
          <font face="Arial, Helvetica, sans-serif" color="#ff0000"
            ><b>Red</b></font
          >
        </td>
        <td bgcolor="#ff0000" align="center">
          <font face="Courier New, monospace"><b>#ff0000</b></font>
        </td>
      </tr>
      <tr>
        <td align="center">
          <font face="Arial, Helvetica, sans-serif"><b>Green</b></font>
        </td>
        <td bgcolor="#00ff00" align="center">
          <font face="Courier New, monospace"><b>#00ff00</b></font>
        </td>
      </tr>
      <tr>
        <td align="center">
          <font face="Arial, Helvetica, sans-serif" color="#0000ff"
            ><b>Blue</b></font
          >
        </td>
        <td bgcolor="#0000ff" align="center">
          <font face="Courier New, monospace"><b>#0000ff</b></font>
        </td>
      </tr>
      <tr>
        <td align="center">
          <font face="Arial, Helvetica, sans-serif" color="#ffff00"
            ><b>Yellow</b></font
          >
        </td>
        <td bgcolor="#ffff00" align="center">
          <font face="Courier New, monospace"><b>#ffff00</b></font>
        </td>
      </tr>
      <tr>
        <td align="center">
          <font face="Arial, Helvetica, sans-serif" color="#ff00ff"
            ><b>Magenta</b></font
          >
        </td>
        <td bgcolor="#ff00ff" align="center">
          <font face="Courier New, monospace"><b>#ff00ff</b></font>
        </td>
      </tr>
      <tr>
        <td align="center">
          <font face="Arial, Helvetica, sans-serif" color="#00ffff"
            ><b>Cyan</b></font
          >
        </td>
        <td bgcolor="#00ffff" align="center">
          <font face="Courier New, monospace"><b>#00ffff</b></font>
        </td>
      </tr>
      <tr>
        <td align="center">
          <font face="Arial, Helvetica, sans-serif"><b>(White)</b></font>
        </td>
        <td bgcolor="#ffffff" align="center">
          <font face="Courier New, monospace"><b>#ffffff</b></font>
        </td>
      </tr>
      <tr>
        <td align="center">
          <font face="Arial, Helvetica, sans-serif" color="#d0b000"
            ><b>My Color</b></font
          >
        </td>
        <td bgcolor="#d0b000" align="center">
          <font face="Courier New, monospace"><b>#d0b000</b></font>
        </td>
      </tr>
    </table>
  </body>
</html>
