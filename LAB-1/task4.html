<html>
  <head>
    <title>Organization Form</title>
  </head>
  <body>
    <form method="post">
      <img src="images/image1.png" alt="image1" />
      <font face="Arial, sans-serif">
        <h3><font color="#005A36">non-profit organization</font></h3>
        <table border="0" cellpadding="3" cellspacing="0" width="500px">
          <tr>
            <td colspan="2"><font color="#666666" size="2">name:</font></td>
            <td><font color="#666666" size="2">phone number:</font></td>
          </tr>
          <tr>
            <td colspan="2">
              <input type="text" name="org_name" style="width: 95%" />
            </td>
            <td><input type="text" name="org_phone" style="width: 95%" /></td>
          </tr>
          <tr>
            <td colspan="3">
              <font color="#666666" size="2">street address:</font>
            </td>
          </tr>
          <tr>
            <td colspan="3">
              <input type="text" name="org_street" style="width: 98%" />
            </td>
          </tr>
          <tr>
            <td><font color="#666666" size="2">city:</font></td>
            <td><font color="#666666" size="2">state:</font></td>
            <td><font color="#666666" size="2">zip code:</font></td>
          </tr>
          <tr>
            <td><input type="text" name="org_city" style="width: 90%" /></td>
            <td><input type="text" name="org_state" style="width: 90%" /></td>
            <td><input type="text" name="org_zip" style="width: 90%" /></td>
          </tr>
        </table>

        <hr size="1" width="500px" color="#80C285" align="left" />

        <img src="images/image2.png" alt="image2" />

        <h3><font color="#005A36">sponsor contact information</font></h3>
        <table border="0" cellpadding="3" cellspacing="0" width="500px">
          <tr>
            <td><font color="#666666" size="2">first name:</font></td>
            <td><font color="#666666" size="2">last name:</font></td>
          </tr>
          <tr>
            <td><input type="text" name="first_name" style="width: 92%" /></td>
            <td><input type="text" name="last_name" style="width: 92%" /></td>
          </tr>
          <tr>
            <td><font color="#666666" size="2">phone number:</font></td>
            <td><font color="#666666" size="2">email address:</font></td>
          </tr>
          <tr>
            <td><input type="text" name="phone" style="width: 92%" /></td>
            <td><input type="text" name="email" style="width: 92%" /></td>
          </tr>
          <tr>
            <td colspan="2">
              <font color="#666666" size="2">street address:</font>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <input type="text" name="sponsor_street" style="width: 98%" />
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <table border="0" cellpadding="0" cellspacing="0" width="500px">
                <tr>
                  <td><font color="#666666" size="2">city:</font></td>
                  <td><font color="#666666" size="2">state:</font></td>
                  <td><font color="#666666" size="2">zip code:</font></td>
                </tr>
                <tr>
                  <td>
                    <input type="text" name="sponsor_city" style="width: 90%" />
                  </td>
                  <td>
                    <input
                      type="text"
                      name="sponsor_state"
                      style="width: 90%"
                    />
                  </td>
                  <td>
                    <input type="text" name="sponsor_zip" style="width: 90%" />
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <hr size="1" color="#80C285" align="left" width="500px" />

        <img src="images/image3.png" alt="image3" />

        <table border="0" cellpadding="3" cellspacing="0" width="500px">
          <tr>
            <td><font color="#666666" size="2">donation amount:</font></td>
            <td><font color="#666666" size="2">payment method:</font></td>
          </tr>
          <tr>
            <td>
              <select name="donation_amount" style="width: 92%">
                <option></option>
              </select>
            </td>
            <td>
              <select name="payment_method" style="width: 92%">
                <option></option>
              </select>
            </td>
          </tr>
        </table>
      </font>
    </form>
  </body>
</html>
