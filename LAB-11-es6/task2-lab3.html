<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>task 2</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8f9fa;
        margin: 30px;
      }

      h1 {
        text-align: center;
      }

      .search {
        text-align: center;
        margin-bottom: 20px;
      }
      input {
        width: 400px;
        outline: none;
        border: 1px solid green;
        padding: 12px;
        border-radius: 5px;
      }

      button {
        padding: 12px 25px;
        cursor: pointer;
        outline: none;
        border: 1px solid green;
        background-color: rgb(3, 88, 49);
        border-radius: 8px;
        color: white;
        font-size: 15px;
      }
      .card {
        background: white;
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 15px;
        margin: 15px auto;
        width: 80%;
        box-sizing: border-box;
      }
      .card h2 {
        margin-top: 0;
      }

      .error {
        width: 80%;
        margin: 20px auto;
        padding: 15px;
        text-align: center;
        color: red;
        background: #ffe5e5;
        border: 1px solid red;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Post & Author Info</h1>
    <div class="search">
      <input
        type="number"
        id="postIdInput"
        placeholder="Enter Post ID (1-100)"
      />
      <button onclick="fetchPostAndAuthor()">Fetch</button>
    </div>

    <div id="resultContainer"></div>

    <script>
      const postIdInput = document.getElementById("postIdInput");
      const resultContainer = document.getElementById("resultContainer");

      async function fetchPostAndAuthor() {
        const postId = postIdInput.value.trim();

        resultContainer.innerHTML = "";

        if (!postId || postId <= 0 || postId > 100) {
          showError();
          return;
        }

        const resPost = await fetch(
          `https://jsonplaceholder.typicode.com/posts/${postId}`,
        );
        const post = await resPost.json();

        const resAuth = await fetch(
          `https://jsonplaceholder.typicode.com/users/${post.userId}`,
        );
        const user = await resAuth.json();
        console.log("post:", post, "user:", user);

        render(post, user);
      }

      function render(post, user) {
        resultContainer.innerHTML = `
                <div class="card">
                    <h2> Post Title</h2>

                    <h3>${post.title}</h3>

                    <p><bold>Post Body:</bold></p>

                    <p>${post.body}</p>
                </div>

                <div class="card">
                    <h2> Author Info</h2>

                    <p><b>Name:</b> ${user.name}</p>

                    <p><b>Email:</b> ${user.email}</p>

                    <p><b>Phone:</b> ${user.phone}</p>

                    <p><b>Website:</b> ${user.website}</p>

                    <p><b>Company:</b> ${user.company.name}</p>

                    <p><b>City:</b> ${user.address.city}</p>
                </div>
            `;
      }

      function showError() {
        resultContainer.innerHTML = `
                <div class="error">
                    Post not found. Please enter an ID between 1 and 100.
                </div>
            `;
      }
    </script>
  </body>
</html>
